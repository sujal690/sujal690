# Keeps the whole profile current: the README follows the time of day in India and the all-time stats refresh.
# GitHub's cron has never fired for this repository, so the "Profile clock" workflow (clock.yml) is what really drives this one: it dispatches
# it at every edition change and every 30 minutes. The schedule below is a second, independent trigger, every run is idempotent, and every
# run restarts the clock if it is not running. Edit this file only through a token with the `workflow` scope.
name: Refresh profile

on:
  schedule:
    - cron: "4,14,24,34,44,54 * * * *"   # odd minutes: GitHub drops runs at :00 and :30 under load
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild every card and the stats now (the clock does not set this)"
        type: boolean
        default: false
  issues:
    types: [opened, edited, labeled]   # a spare trigger: open or label any issue to force a refresh
  push:
    branches: [main]
    paths:
      - "scripts/**"

concurrency:
  group: profile-refresh
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install --quiet fonttools brotli pillow
      - name: Refresh (edition by time of day, stats when stale)
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/refresh.py ${{ (github.event_name == 'push' || inputs.force == true) && '--force' || '' }}
      - name: Commit and push (retries on conflicts)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Refresh profile"
          for i in 1 2 3 4 5; do
            if git pull --rebase -q origin main && git push -q origin HEAD:main; then exit 0; fi
            sleep $((i * 6))
          done
          echo "push failed after retries"; exit 1
      - name: Keep the clock running
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          active=$(gh api "repos/${{ github.repository }}/actions/workflows/clock.yml/runs?per_page=10" --jq '[.workflow_runs[] | select(.status=="queued" or .status=="in_progress" or .status=="waiting" or .status=="pending" or .status=="requested")] | length')
          echo "clock runs alive: $active"
          if [ "$active" = "0" ]; then gh workflow run clock.yml --ref main; fi
