<!doctype html><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600&family=Syne:wght@600;700;800&display=swap">
<style>
 html,body{margin:0;background:#0b130c}
 #stage{position:relative;width:1200px;height:600px;overflow:hidden;font-family:Manrope,sans-serif;color:#f3f1e6}
 canvas{position:absolute;inset:0;width:100%;height:100%}
 .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(7,12,7,.80) 0%,rgba(7,12,7,.48) 34%,rgba(7,12,7,0) 60%),linear-gradient(0deg,rgba(7,12,7,.32),rgba(7,12,7,0) 28%)}
 #txt{position:absolute;left:68px;top:128px;width:560px}
 .chip{display:inline-flex;align-items:center;gap:10px;height:32px;padding:0 14px 0 6px;border-radius:99px;background:rgba(8,14,8,.5);box-shadow:inset 0 0 0 1px rgba(243,241,230,.2);font-size:14px;font-weight:500;color:#dcdfcd;margin-bottom:26px}
 .chip img{width:22px;height:22px;border-radius:50%;object-fit:cover}
 .chip i{width:6px;height:6px;border-radius:50%;background:#e4a867;box-shadow:0 0 0 3px rgba(228,168,103,.2)}
 h1{margin:0;font:700 70px/0.98 Syne,sans-serif;letter-spacing:-.02em;text-shadow:0 2px 28px rgba(0,0,0,.4)}
 .role{margin-top:20px;font-weight:600;font-size:21px;letter-spacing:-.005em}
 .role em{font-style:normal;color:#b9c3a6;font-weight:400}
 p{margin:14px 0 0;font-weight:300;font-size:17.5px;line-height:1.6;color:#d3d9c4;max-width:430px}
</style>
<div id="stage">
  <canvas id="c" width="1200" height="600"></canvas>
  <div class="shade"></div>
  <div id="txt">
    <div class="chip"><img src="photo.png"><i></i><span id="greet">Good morning</span><span style="opacity:.55">· Navi Mumbai</span></div>
    <h1>Sujal Shah</h1>
    <div class="role">AI Software Engineer <em>at Sky Gold and Diamonds</em></div>
    <p>Production AI and full-stack systems, from the first prototype to tools the whole company runs on.</p>
  </div>
</div>

<script type="module">
import { createLeafHero2 } from './leafhero2.js?v=3';
const phase = new URLSearchParams(location.search).get('phase') || 'day';
const pl = createLeafHero2({ canvas: document.getElementById('c'), width: 1200, height: 600, T: 12, phase });
document.getElementById('greet').textContent = pl.greet;
window.renderAt = (t) => pl.frame(t); window.pl = pl;
await document.fonts.ready;
