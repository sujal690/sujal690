# Refreshes the Activity card from the GitHub API every 6 hours.
# Activate by moving this file to .github/workflows/profile.yml
name: Refresh profile stats

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install --quiet fonttools brotli pillow
          python scripts/build_stats.py docs/stats.json
          python scripts/gen.py docs/stats.json assets
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Refresh profile stats" && git push)
